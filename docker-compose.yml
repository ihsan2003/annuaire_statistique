
services:
  # Base de données MySQL
  db:
    image: mysql:8.0
    container_name: annuaire_db
    restart: always
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - annuaire_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # Application Django
  web:
    build: .
    container_name: annuaire_web
    restart: always
    command: gunicorn annuaire_statistique.wsgi:application --bind 0.0.0.0:8000 --workers 3
    volumes:
      - .:/app
      - static_volume:/app/static
      - media_volume:/app/media
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - annuaire_network

  # Nginx (optionnel mais recommandé pour la production)
  nginx:
    image: nginx:alpine
    container_name: annuaire_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/app/static
      - media_volume:/app/media
    depends_on:
      - web
    networks:
      - annuaire_network

volumes:
  mysql_data:
  static_volume:
  media_volume:

networks:
  annuaire_network:
    driver: bridge