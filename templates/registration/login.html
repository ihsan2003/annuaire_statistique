{% load static %}
<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="utf-8">
    <title>Connexion</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css"
        rel="stylesheet">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">

    <!-- Styles -->
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background-image: url('{% static "images/wallpapper.jpg" %}');
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 450px;
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 15px;
            padding: 2.5rem 2rem;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            color: #333;
            animation: slideIn 0.6s ease-out;
        }

        h2.text-center {
            font-weight: bold;
            margin-bottom: 2rem;
            color: #3a3a3a;
        }

        .input-group-text {
            background-color: rgba(165, 84, 183, 0.2);
            color: #333;
            border-right: none;
        }

        .form-control {
            border-left: none;
            transition: all 0.3s;
            background-color: rgba(255, 255, 255, 0.7);
            color: #333;
        }

        .form-control::placeholder {
            color: #777;
        }

        .form-control:focus {
            border-color: #A554B7;
            box-shadow: 0 0 0 0.2rem rgba(165, 84, 183, 0.25);
            background-color: white;
        }

        .btn {
            background-color: #A554B7;
            color: white;
            padding: 12px 30px;
            font-weight: 500;
            border-radius: 25px;
            transition: background 0.3s ease;
            border: none;
        }

        .btn:hover {
            background-color: #FFD912;
            color: #000;
        }

        .text-center a {
            color: #A554B7;
            text-decoration: none;
            font-size: 0.9rem;
        }

        .text-center a:hover {
            text-decoration: underline;
        }

        .logo-container img {
            width: 90%;        /* largeur par défaut */
            max-width: 450px;  /* augmente la taille maximale */
            opacity: 0.9;
            margin-bottom: 30px;
        }

        @keyframes slideIn {
            0% {
                opacity: 0;
                transform: translateY(30px);
            }

            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 576px) {
            .card {
                padding: 2rem 1rem;
            }

            .logo-container img {
                width: 80%;
                max-width: 400px;
                margin-bottom: 30px;
            }

            h2.text-center {
                font-size: 1.5rem;
            }

            .btn {
                padding: 10px 20px;
            }
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="logo-container text-center">
            <img src="{% static 'images/logo.png' %}" alt="Logo">
        </div>

        <h2 class="text-center mb-4">Se connecter</h2>

        <form method="post">
            {% csrf_token %}
            {% if next %}
                <input type="hidden" name="next" value="{{ next }}">
            {% endif %}
            <div class="input-group mb-3">
                <span class="input-group-text"><i class="bi bi-person-fill fs-5"></i></span>
                <input type="text" class="form-control" name="username" required placeholder="Nom d'utilisateur">
            </div>

            <div class="input-group mb-3">
                <span class="input-group-text"><i class="bi bi-lock-fill fs-5"></i></span>
                <input type="password" class="form-control" name="password" required placeholder="Mot de passe">
            </div>

            <div class="text-center mb-3 mt-4">
                <a href="#">Mot de passe oublié ?</a>
            </div>

            <div class="d-flex justify-content-center mt-4">
                <button type="submit" class="btn">Connexion</button>
            </div>
        </form>
    </div>
</body>

</html>
